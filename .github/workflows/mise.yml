name: mise

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Version lookups for github:/aqua tools hit the GitHub API.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # `mise run` would otherwise install every [tools] entry before running tests.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install prerequisites
        run: pacman -Syu --noconfirm mise git zsh lua bun jq python python-yaml

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Link modules as mise conf.d
        run: mkdir -p ~/.config/mise && ln -s "$GITHUB_WORKSPACE/modules" ~/.config/mise/conf.d

      # mise older than conf.d folder support loads no module and `mise bootstrap` exits 0
      # having done nothing; fail loudly instead. Run from ~ so no project config can shadow `check`.
      - name: Verify modules loaded
        run: |
          cd ~
          mise tasks info check >/dev/null || { echo "modules did not load (mise $(mise --version))"; exit 1; }

      - name: Dry-run omarchy
        run: MISE_AUTO_ENV=true MISE_ENV=omarchy mise bootstrap --dry-run --yes

      - name: Dry-run cachyos
        run: MISE_AUTO_ENV=true MISE_ENV=cachyos mise bootstrap --dry-run --yes

      - name: Tests (omarchy)
        run: MISE_AUTO_ENV=true MISE_ENV=omarchy mise run --jobs 1 'test:*'

      - name: Tests (cachyos)
        run: MISE_AUTO_ENV=true MISE_ENV=cachyos mise run --jobs 1 'test:*'

  # Scoped real apply: only the dotfiles and tools steps. Packages, services,
  # system files and the bootstrap task need systemd, an AUR helper, multilib
  # and Omarchy's repo, none of which a stock container has; the dry-runs in
  # `arch` cover those. This job catches what dry-runs cannot: tool installs
  # that fail (npm trust policy, go builds) and dotfile entries that do not converge.
  apply:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      # cachyos declares node = "lts", which the npm: tools need; omarchy relies
      # on Omarchy pinning node globally.
      MISE_AUTO_ENV: "true"
      MISE_ENV: cachyos
      # Registry lookups (proxy.golang.org, npm) time out at the 20s default.
      MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 120s
      MISE_HTTP_TIMEOUT: 120s
    steps:
      # gcc: go: tools with cgo (helm-ls). On a real machine base-devel comes from the packages step.
      - name: Install prerequisites
        run: pacman -Syu --noconfirm mise git zsh go gcc

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Link modules as mise conf.d
        run: mkdir -p ~/.config/mise && ln -s "$GITHUB_WORKSPACE/modules" ~/.config/mise/conf.d

      - name: Verify modules loaded
        run: |
          cd ~
          mise tasks info check >/dev/null || { echo "modules did not load (mise $(mise --version))"; exit 1; }

      - name: Apply dotfiles and tools
        run: mise bootstrap --only dotfiles,tools --yes

      # Permission-only entries (~/.omp/agent/mcp.json, ~/.cursor/cli-config.json) cannot
      # apply until a merge has created the file, so a fresh machine needs two runs.
      - name: Apply again (settle first-run leftovers)
        run: mise bootstrap --only dotfiles,tools --yes

      - name: Apply a third time (must change nothing)
        run: |
          mise bootstrap --only dotfiles,tools --yes 2>&1 | tee apply3.log
          grep -F 'all files are applied' apply3.log
          grep -F 'all edits are applied' apply3.log
          grep -F 'all tools are installed' apply3.log
          mise dot status --missing
          # `mise ls --missing` prints one row per missing tool and exits 0 either way.
          missing=$(mise ls --missing)
          if [ -n "$missing" ]; then echo "missing tools:"; echo "$missing"; exit 1; fi

      - name: Smoke test shells
        run: |
          # zshenv puts the mise shims on PATH for every shell.
          shims="$HOME/.local/share/mise/shims"
          for tool in node gopls task; do
            [ "$(zsh -c "command -v $tool")" = "$shims/$tool" ] || { echo "non-interactive zsh: $tool not at $shims/$tool"; exit 1; }
          done
          # The first interactive start clones zinit and its plugins; that output and the
          # terminal control codes around it make the last line unusable, so tag ours.
          out=$(TERM=xterm zsh -ic 'print -r -- NODE=$(command -v node)' 2>/dev/null </dev/null | grep -ao 'NODE=[^[:cntrl:]]*' | tail -n 1 || true)
          [ "$out" = "NODE=$shims/node" ] || { echo "interactive zsh: got '$out', want NODE=$shims/node"; exit 1; }

  system-sudoers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install sudoers test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes sudo bubblewrap

      # Use the packaged bubblewrap/AppArmor policy; never weaken host namespace
      # restrictions or run this suite as root. Missing support must fail loudly.
      - name: Test isolated sudoers policy as the runner account
        run: bash modules/system/tests/test_sudoers.sh

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The runner image sets HOMEBREW_NO_AUTO_UPDATE=1 and ships a weeks-old Homebrew
      # snapshot (it poured mise 2026.9.1 while Homebrew had 2026.10.10); update first.
      - name: Install prerequisites
        run: |
          brew update
          brew install mise lua jq python oven-sh/bun/bun

      - name: Link modules as mise conf.d
        run: mkdir -p ~/.config/mise && ln -s "$GITHUB_WORKSPACE/modules" ~/.config/mise/conf.d

      - name: Verify modules loaded
        run: |
          cd ~
          mise tasks info check >/dev/null || { echo "modules did not load (mise $(mise --version))"; exit 1; }

      - name: Dry-run macos
        run: |
          cd ~
          MISE_AUTO_ENV=true mise bootstrap --dry-run --yes

      - name: Tests (all loaded macos modules)
        run: |
          cd ~
          # Enable the native source-relative fixture, not just its stubbed cases.
          MISE_AUTO_ENV=true DOTFILES_TEST_REAL_MISE="$(command -v mise)" mise run --jobs 1 'test:*'
