name: Shell Script Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths: ['bin/**', 'modules/**/*.sh']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        run: shellcheck -x bin/dotfiles modules/*/bootstrap.sh modules/omarchy/theme.sh modules/omarchy/hypr-instance.sh
