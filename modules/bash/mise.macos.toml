[bootstrap.repos."~/.oh-my-bash"]
url = "https://github.com/ohmybash/oh-my-bash.git"

[dotfiles]
"~/.bashrc" = { source = "bashrc" }
"~/.profile" = { source = "profile" }
"~/.config/bash" = { source = "bash", mode = "symlink-each" }
"~/.config/bash/zz_os_functions.sh" = { source = "os/macos/zz_os_functions.sh" }
"~/.oh-my-bash/custom/themes/axin/axin.theme.sh" = { source = "themes/axin/axin.theme.sh" }
# retired
"~/.config/bash/dotfiles_completions.sh" = { mode = "absent" }
