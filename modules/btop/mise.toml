[dotfiles."~/.config/btop/themes/catppuccin_mocha.theme"]
source = "catppuccin_mocha.theme"
variants = [{ os = "macos" }]

# btop.conf is task-owned, key by key: btop rewrites the whole file when a menu setting changes,
# and mise merges only JSON/TOML/YAML. mise.omarchy.toml swaps the theme file for Omarchy's.
[tasks."bootstrap:btop"]
description = "Set the btop.conf keys this repo owns"
run = "./settings.sh settings.conf catppuccin.conf"

[tasks."test:btop"]
description = "Run the btop settings merge test"
run = "bash tests/test_settings.sh"
