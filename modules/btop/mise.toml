# Copied: btop rewrites the whole file on exit, which would keep dirtying the repo.
[dotfiles."~/.config/btop/btop.conf"]
source = "btop.conf"
mode = "copy"
variants = [{ os = "macos" }, { profile = "cachyos" }]

[dotfiles."~/.config/btop/themes/catppuccin_mocha.theme"]
source = "catppuccin_mocha.theme"
variants = [{ os = "macos" }, { profile = "cachyos" }]
