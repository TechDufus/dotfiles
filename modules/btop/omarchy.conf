#? Omarchy-profile btop.conf keys, applied after settings.conf.

#* Omarchy owns btop's colors: themes/current.theme links to the active Omarchy theme's
#* btop.theme, and every theme switch regenerates it and signals btop to reload.
color_theme = "current"

#* gpu0 needs a GPU library btop can load: rocm-smi-lib (mise.omarchy.toml) for AMD,
#* including integrated Radeon graphics. Without one, btop drops the box and saves that.
shown_boxes = "cpu mem net proc gpu0"
