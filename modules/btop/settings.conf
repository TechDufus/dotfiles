#? btop.conf keys this repo owns on every machine; bootstrap:btop sets them and leaves the rest.
#? Theme selection lives in omarchy.conf / catppuccin.conf. Only values that differ from btop's
#? own defaults belong here; a key removed from this file keeps its last value until changed.
#? Only values btop keeps: it drops a gpuN box it cannot read and saves that on exit, so
#? shown_boxes with gpu0 would flip back on every run where no GPU library is installed.

#* Transparent background: the terminal's background shows through instead of the theme's.
theme_background = false

#* Update time in milliseconds (btop default 2000).
update_ms = 200

cpu_graph_upper = "total"
cpu_graph_lower = "total"

use_fstab = false
net_sync = false
