[bootstrap.packages]
"brew:k9s" = "latest"

# k9s writes config.yaml only when it is missing, so links are safe.
[dotfiles]
"~/Library/Application Support/k9s/config.yaml" = { source = "config.yaml" }
"~/Library/Application Support/k9s/plugins.yaml" = { source = "plugins.yaml" }
"~/Library/Application Support/k9s/aliases.yaml" = { source = "aliases.yaml" }
"~/Library/Application Support/k9s/skins/current.yaml" = { source = "catppuccin_mocha.yaml" }
