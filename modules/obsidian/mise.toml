[tasks."bootstrap:obsidian"]
description = "Clone the SecondBrain vault once; never update it"
run = '''[ -d "$HOME/SecondBrain/.git" ] || GIT_TERMINAL_PROMPT=0 GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' git clone git@github.com:techdufus/SecondBrain.git "$HOME/SecondBrain" >/dev/null 2>&1 || echo "obsidian: SecondBrain clone failed, skipped"'''
