[dotfiles]
"~/.config/hypr/dotfiles" = { source = "hypr", mode = "symlink-each" }
"~/.config/hypr/dotfiles/keyboard.lua" = { source = "keyboard.lua", mode = "copy" }
"~/.config/fcitx5/conf/keyboard.conf" = { source = "fcitx5/keyboard.conf", mode = "copy" }
# Required from autostart.lua (not hyprland.lua) so Omarchy's refresh of hyprland.lua cannot drop it;
# hyprland.lua loads hypr.autostart before default.hypr.toggles.
"~/.config/hypr/autostart.lua/dotfiles" = { block = 'require("hypr.dotfiles.main")' }

[tasks."bootstrap:omarchy"]
description = "Reload Hyprland, validate its config, restart fcitx5"
sources = ["hypr/*.lua", "keyboard.lua", "fcitx5/keyboard.conf"]
outputs = { auto = true }
run = "./bootstrap.sh"

[tasks."test:omarchy"]
description = "Run the summon and cells Lua tests"
run = ["lua tests/test_summon.lua", "lua tests/test_cells.lua"]
