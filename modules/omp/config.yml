modelRoles:
  smol: openai-codex/gpt-6-luna:low
  tiny: openai-codex/gpt-6-luna:low
  memory: openai-codex/gpt-6.1-terra:medium
  task: openai-codex/gpt-6.1-sol
  slow: openai-codex/gpt-6-astra
  plan: openai-codex/gpt-6-astra
  designer: openai-codex/gpt-6-astra
  vision: openai-codex/gpt-6.1-terra:high
  commit: openai-codex/gpt-6.1-terra:low
  advisor: openai-codex/gpt-6.1-terra:medium
  reviewer: openai-codex/gpt-6.1-sol
  default: openai-codex/gpt-6-astra:xhigh
cycleOrder:
  - smol
  - default
theme:
  dark: dark-catppuccin
symbolPreset: nerd
display:
  shimmer: kitt
defaultThinkingLevel: xhigh
advisor:
  enabled: true
error:
  notify: "on"
hideThinkingBlock: true
disabledProviders:
  - claude
  - claude-plugins
  - codex
  - opencode
  - cline
  - gemini
  - windsurf
  - vscode
  - github
  - amazon-bedrock
  - ollama
bashInterceptor:
  enabled: true
edit:
  streamingAbort: true
lsp:
  diagnosticsOnEdit: true
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  proactiveLinking: true
  enhancedRecall: true
github:
  enabled: true
security:
  enabled: true
task:
  showResolvedModelBadge: true
  enableLsp: true
  maxEffort: xhigh
  isolation:
    commits: ai
    enabled: true
skills:
  enableClaudeProject: false
commands:
  enableClaudeProject: false
  enableOpencodeProject: false
mcp:
  enableProjectConfig: false
setupVersion: 3
vault:
  enabled: true
dev:
  autoqaConsent: granted
tier:
  openai: default
  advisor: inherit
statusLine:
  transparent: true
readLineNumbers: true
eval:
  autoBackground:
    enabled: true
computer:
  enabled: true
secrets:
  enabled: true
terminal:
  showProgress: true
tui:
  tight: true
  codexResetFireworks: true
features:
  unexpectedStopDetection: smart
codexResets:
  autoRedeem: "yes"
composer:
  shape: box
  tokenRate: true