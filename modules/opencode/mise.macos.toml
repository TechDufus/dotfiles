# Omarchy installs opencode through a ~/.local/bin wrapper that runs `mise use -g`, which writes
# ~/.config/mise/config.toml. A second global declaration here makes that command fail
# ("declared in multiple global config files"), so only non-Omarchy machines declare it.
[tools]
opencode = "latest"

[dotfiles]
# Retire the obsolete companion config, not the plugin in opencode.json.
"~/.config/opencode/oh-my-opencode.json" = { mode = "absent" }
