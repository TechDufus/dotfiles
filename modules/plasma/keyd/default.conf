# Managed by ~/.dotfiles modules/plasma.
# Wayland-safe summon leader:
# - tap Caps Lock/F13 once, then a logical app letter to emit F13 + that letter
# - tap Caps Lock/F13 twice, then a logical macro letter to run the macro action
#
# keyd matches physical key names before the compositor applies the keyboard
# layout. Keep the app layers broad so QWERTY and Dvorak logical letters both
# reach the same KWin F13,<letter> shortcuts.
[ids]
*

[global]
oneshot_timeout = 2000

[main]
capslock = overload(plasma_summon, oneshot(plasma_leader))
f13 = overload(plasma_summon, oneshot(plasma_leader))

[plasma_summon]
a = macro(f13 a)
b = macro(f13 b)
c = macro(f13 c)
d = macro(f13 d)
e = macro(f13 e)
f = macro(f13 f)
g = macro(f13 g)
h = macro(f13 h)
i = macro(f13 i)
j = macro(f13 j)
k = macro(f13 k)
l = macro(f13 l)
m = macro(f13 m)
n = macro(f13 n)
o = macro(f13 o)
p = macro(f13 p)
q = macro(f13 q)
r = macro(f13 r)
s = macro(f13 s)
t = macro(f13 t)
u = macro(f13 u)
v = macro(f13 v)
w = macro(f13 w)
x = macro(f13 x)
y = macro(f13 y)
z = macro(f13 z)
semicolon = macro(f13 semicolon)
comma = macro(f13 comma)
dot = macro(f13 dot)
slash = macro(f13 slash)
esc = clear()
f13 = clear()
capslock = clear()

# A shifted leader emits an unmodified F13, then the shifted physical key.
# Shift is associated with this composite layer, so it does not modify f13.
[plasma_summon+shift]
a = macro(f13 S-a)
b = macro(f13 S-b)
c = macro(f13 S-c)
d = macro(f13 S-d)
e = macro(f13 S-e)
f = macro(f13 S-f)
g = macro(f13 S-g)
h = macro(f13 S-h)
i = macro(f13 S-i)
j = macro(f13 S-j)
k = macro(f13 S-k)
l = macro(f13 S-l)
m = macro(f13 S-m)
n = macro(f13 S-n)
o = macro(f13 S-o)
p = macro(f13 S-p)
q = macro(f13 S-q)
r = macro(f13 S-r)
s = macro(f13 S-s)
t = macro(f13 S-t)
u = macro(f13 S-u)
v = macro(f13 S-v)
w = macro(f13 S-w)
x = macro(f13 S-x)
y = macro(f13 S-y)
z = macro(f13 S-z)
semicolon = macro(f13 S-semicolon)
comma = macro(f13 S-comma)
dot = macro(f13 S-dot)
slash = macro(f13 S-slash)

[plasma_leader]
a = macro(f13 a)
b = macro(f13 b)
c = macro(f13 c)
d = macro(f13 d)
e = macro(f13 e)
f = macro(f13 f)
g = macro(f13 g)
h = macro(f13 h)
i = macro(f13 i)
j = macro(f13 j)
k = macro(f13 k)
l = macro(f13 l)
m = macro(f13 m)
n = macro(f13 n)
o = macro(f13 o)
p = macro(f13 p)
q = macro(f13 q)
r = macro(f13 r)
s = macro(f13 s)
t = macro(f13 t)
u = macro(f13 u)
v = macro(f13 v)
w = macro(f13 w)
x = macro(f13 x)
y = macro(f13 y)
z = macro(f13 z)
semicolon = macro(f13 semicolon)
comma = macro(f13 comma)
dot = macro(f13 dot)
slash = macro(f13 slash)
capslock = oneshot(plasma_macro_action)
f13 = oneshot(plasma_macro_action)
esc = clear()

# Covers the one-shot CapsLock/F13 leader path as well as a held leader.
[plasma_leader+shift]
a = macro(f13 S-a)
b = macro(f13 S-b)
c = macro(f13 S-c)
d = macro(f13 S-d)
e = macro(f13 S-e)
f = macro(f13 S-f)
g = macro(f13 S-g)
h = macro(f13 S-h)
i = macro(f13 S-i)
j = macro(f13 S-j)
k = macro(f13 S-k)
l = macro(f13 S-l)
m = macro(f13 S-m)
n = macro(f13 S-n)
o = macro(f13 S-o)
p = macro(f13 S-p)
q = macro(f13 S-q)
r = macro(f13 S-r)
s = macro(f13 S-s)
t = macro(f13 S-t)
