[bootstrap.packages]
"pacman:plasma-meta" = "latest"
"pacman:sddm" = "latest"
"pacman:xdg-desktop-portal-kde" = "latest"
"pacman:qt6-wayland" = "latest"
"pacman:qt6-tools" = "latest"
"pacman:xorg-xwayland" = "latest"
"pacman:dolphin" = "latest"
"pacman:konsole" = "latest"
"pacman:systemsettings" = "latest"
"pacman:spectacle" = "latest"
"pacman:ark" = "latest"
"pacman:kate" = "latest"
"pacman:kcalc" = "latest"
"pacman:kdialog" = "latest"
"pacman:fuzzel" = "latest"
"pacman:rofimoji" = "latest" # revisit after Plasma 6.8; upstream emojier quits after copy
"pacman:rofi" = "latest"
"pacman:wl-clipboard" = "latest"
"pacman:noto-fonts-emoji" = "latest"
"pacman:kpackage" = "latest"
"pacman:kconfig" = "latest"
"pacman:python" = "latest"
"pacman:python-dbus-next" = "latest"
"pacman:keyd" = "latest"

[dotfiles]
"~/.config/rofimoji.rc" = { source = "rofimoji.rc" }
"~/.local/bin/plasma-summon-service" = { source = "bin/plasma-summon-service.py" }
"~/.config/plasma-summon" = { source = "summon", mode = "symlink-each" }
"~/.config/systemd/user/plasma-summon.service" = { source = "systemd/plasma-summon.service" }
"~/.local/share/kwin/scripts/plasma-summon" = { source = "kwin/plasma-summon", mode = "symlink" }
"~/.config/systemd/user/default.target.wants/plasma-summon.service" = { mode = "absent" }

[bootstrap.directories."/etc/keyd"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/keyd/default.conf"]
source = "keyd/default.conf"
owner = "root"
group = "root"
mode = "0644"
notify = ["keyd"]

[bootstrap.files."/usr/local/bin/plasma-summon-keyd"]
source = "keyd/plasma-summon-keyd"
template = true
owner = "root"
group = "root"
mode = "0755"

[bootstrap.services.keyd]
enabled = true
state = "running"

[tasks."bootstrap:plasma"]
description = "Enable SDDM, apply Plasma settings, start the summon service and KWin script"
run = "./bootstrap.sh"

[tasks."test:plasma"]
description = "Run the plasma-summon-service unit tests"
env = { PYTHONDONTWRITEBYTECODE = "1" }
run = "python3 tests/test_summon_service.py"
