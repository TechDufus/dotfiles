[bootstrap.packages]
"pacman:gamescope" = "latest"
"pacman:mangohud" = "latest"
"pacman:goverlay" = "latest"
"pacman:gamemode" = "latest"
"pacman:protontricks" = "latest"
"pacman:winetricks" = "latest"
"pacman:vulkan-tools" = "latest"
"pacman:vulkan-icd-loader" = "latest"
"pacman:nvidia-utils" = "latest"
"pacman:steam" = "latest"
"pacman:lib32-mangohud" = "latest"
"pacman:lib32-gamemode" = "latest"
"pacman:lib32-vulkan-icd-loader" = "latest"
"pacman:lib32-nvidia-utils" = "latest"
"pacman:cachyos-gaming-meta" = "latest"
"pacman:gamescope-session-cachyos" = "latest"

[dotfiles]
"~/.local/bin/steam-health" = { source = "bin/steam-health" }

[tasks."bootstrap:steam"]
description = "Gamescope realtime capability and gamemode group"
run = "./bootstrap.sh"

[tasks."test:steam"]
description = "Run the steam-health unit tests"
env = { PYTHONDONTWRITEBYTECODE = "1" }
run = "python3 tests/test_steam_health.py"
