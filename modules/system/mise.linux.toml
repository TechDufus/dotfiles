[bootstrap.packages]
"pacman:jq" = "latest"
"pacman:open-iscsi" = "latest"
"pacman:unzip" = "latest"

[bootstrap.files."/etc/sudoers.d/techdufus"]
content = "{{ get_env(name='USER', default='root') }} ALL=(ALL) NOPASSWD: ALL\n"
template = true
owner = "root"
group = "root"
mode = "0440"

[bootstrap.files."/etc/udev/rules.d/90-disable-logitech-receiver-wakeup.rules"]
source = "udev/rules.d/90-disable-logitech-receiver-wakeup.rules"
owner = "root"
group = "root"
mode = "0644"

[tasks."bootstrap:system"]
description = "Validate sudoers, reload udev, set keymap and locale"
run = "./bootstrap.sh"
