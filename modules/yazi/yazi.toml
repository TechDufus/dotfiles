#:schema https://yazi-rs.github.io/schemas/yazi.json
# Overrides for Yazi 26.9.1; unspecified settings use the shipped defaults.

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
linemode = "size"
show_hidden = true

[preview]
max_width = 1000
max_height = 1000

[opener]
edit = [
  { run = "${EDITOR:-nvim} %s", desc = "$EDITOR", block = true, for = "macos" },
]
