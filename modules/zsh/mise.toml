[dotfiles]
"~/.zshenv" = { source = "zshenv" }
"~/.zshrc" = { source = "zshrc" }
"~/.p10k.zsh" = { source = "p10k.zsh" }
# Per-file links: a file deleted from zsh/ loses its link on the next apply.
"~/.config/zsh" = { source = "zsh", mode = "symlink-each" }
# retired
"~/.config/zsh/nvm_config.zsh" = { mode = "absent" }
"~/.config/zsh/dotfiles_completions.zsh" = { mode = "absent" }

[tasks."test:zsh"]
description = "Run the zsh shell tests"
run = '''
rc=0
for t in tests/test_*.sh; do
  echo "== $t"
  bash "$t" || rc=1
done
exit $rc
'''
