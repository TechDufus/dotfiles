---
- name: Detect Omarchy markers
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/omarchy
    - /usr/share/omarchy
  register: dotfiles_omarchy_markers
  check_mode: false

- name: Register desktop session facts
  ansible.builtin.set_fact:
    dotfiles_is_omarchy: "{{ dotfiles_omarchy_markers.results | selectattr('stat.exists') | list | length > 0 }}"
    dotfiles_session: "{{ 'omarchy' if (dotfiles_omarchy_markers.results | selectattr('stat.exists') | list | length > 0) else 'default' }}"

- name: Show desktop session
  ansible.builtin.debug:
    msg: "Desktop session: {{ dotfiles_session }}"
