---
- name: "{{ role_name }} | Checking for Distribution Config: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: distribution_config

- name: "{{ role_name }} | Run Tasks: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: distribution_config.stat.exists

- name: "{{ role_name }} | Refresh 1Password CLI detection after install"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/pre_tasks/detect_1password.yml"

- name: "{{ role_name }} | Explain next step when not authenticated"
  ansible.builtin.debug:
    msg:
      - "1Password is installed, but the CLI is not authenticated yet."
      - "Open 1Password, sign in or unlock it, then rerun: dotfiles -t 1password,ssh,git,jj,fonts"
  when:
    - op_installed | default(false)
    - not (op_authenticated | default(false))

- name: "{{ role_name }} | Ensure config dir exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config"
    state: directory
    mode: "0755"

- name: "{{ role_name }} | Ensure 1Password config dir exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/1Password"
    state: directory
    mode: "0755"

- name: "{{ role_name }} | Ensure ssh 1Password config dir exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/1Password/ssh"
    state: directory
    mode: "0755"

- name: "{{ role_name }} | Deploy ssh config"
  ansible.builtin.copy:
    src: agent.toml
    dest: "{{ ansible_facts['user_dir'] }}/.config/1Password/ssh/agent.toml"
    mode: "0600"
