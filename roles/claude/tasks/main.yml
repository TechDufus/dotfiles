---

# Check for OS-specific configuration
- name: "{{ role_name }} | Checking for Distribution Config: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: distribution_config

- name: "{{ role_name }} | Run Tasks: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: distribution_config.stat.exists

# Common Claude configuration for all operating systems
- name: "{{ role_name }} | Ensure ~/.claude directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude"
    state: directory
    mode: '0755'

- name: "{{ role_name }} | Check if settings.json exists and is not a symlink"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
  register: settings_file

- name: "{{ role_name }} | Remove existing settings.json if it's not a symlink"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
    state: absent
  when: settings_file.stat.exists and not settings_file.stat.islnk

- name: "{{ role_name }} | Create symlink to Claude settings.json"
  ansible.builtin.file:
    src: "{{ role_path }}/files/settings.json"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
    state: link
    force: true

- name: "{{ role_name }} | Check if ~/.claude/scripts exists and is not a symlink"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/scripts"
  register: scripts_dir

- name: "{{ role_name }} | Remove existing scripts directory if it's not a symlink"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/scripts"
    state: absent
  when: scripts_dir.stat.exists and not scripts_dir.stat.islnk

- name: "{{ role_name }} | Create symlink to Claude scripts"
  ansible.builtin.file:
    src: "{{ role_path }}/files/scripts"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/scripts"
    state: link
    force: true

- name: "{{ role_name }} | Check if ~/.claude/commands exists and is not a symlink"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/commands"
  register: commands_dir

- name: "{{ role_name }} | Remove existing commands directory if it's not a symlink"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/commands"
    state: absent
  when: commands_dir.stat.exists and not commands_dir.stat.islnk

- name: "{{ role_name }} | Create symlink to Claude commands"
  ansible.builtin.file:
    src: "{{ role_path }}/files/commands"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/commands"
    state: link
    force: true

- name: "{{ role_name }} | Check if ~/.claude/hooks exists and is not a symlink"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/hooks"
  register: hooks_dir

- name: "{{ role_name }} | Remove existing hooks directory if it's not a symlink"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/hooks"
    state: absent
  when: hooks_dir.stat.exists and not hooks_dir.stat.islnk

- name: "{{ role_name }} | Create symlink to Claude hooks"
  ansible.builtin.file:
    src: "{{ role_path }}/files/hooks"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/hooks"
    state: link
    force: true

- name: "{{ role_name }} | Check repo-managed Claude agents source"
  ansible.builtin.stat:
    path: "{{ role_path }}/files/agents"
  register: claude_agents_source

- name: "{{ role_name }} | Check if ~/.claude/agents exists and is not a symlink"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/agents"
  register: agents_dir
  when: claude_agents_source.stat.isdir | default(false)

- name: "{{ role_name }} | Remove existing agents directory if it's not a symlink"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/agents"
    state: absent
  when:
    - claude_agents_source.stat.isdir | default(false)
    - agents_dir.stat.exists | default(false)
    - not (agents_dir.stat.islnk | default(false))

- name: "{{ role_name }} | Create symlink to Claude agents"
  ansible.builtin.file:
    src: "{{ role_path }}/files/agents"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/agents"
    state: link
    force: true
  when: claude_agents_source.stat.isdir | default(false)

- name: "{{ role_name }} | Skills | Check Claude skills destination"
  ansible.builtin.stat:
    path: "{{ claude_skills_dest }}"
    follow: false
  register: claude_skills_dest_stat

- name: "{{ role_name }} | Skills | Refuse unmanaged Claude skills destination"
  ansible.builtin.fail:
    msg: >-
      {{ claude_skills_dest }} exists and is not a directory or symlink.
      Move or remove it, then rerun `dotfiles -t claude`.
  when:
    - claude_skills_dest_stat.stat.exists
    - not (claude_skills_dest_stat.stat.isdir | default(false))
    - not (claude_skills_dest_stat.stat.islnk | default(false))

- name: "{{ role_name }} | Skills | Replace leftover Claude skills directory symlink"
  ansible.builtin.file:
    path: "{{ claude_skills_dest }}"
    state: absent
  when:
    - claude_skills_dest_stat.stat.exists
    - claude_skills_dest_stat.stat.islnk | default(false)

- name: "{{ role_name }} | Skills | Ensure Claude skills directory exists"
  ansible.builtin.file:
    path: "{{ claude_skills_dest }}"
    state: directory
    mode: "0755"

- name: "{{ role_name }} | Skills | Check repo-managed Claude skills source"
  ansible.builtin.stat:
    path: "{{ claude_skills_source }}"
  register: claude_skills_source_directory

- name: "{{ role_name }} | Skills | Find repo-managed Claude skills"
  ansible.builtin.find:
    paths: "{{ claude_skills_source }}"
    file_type: directory
    recurse: false
  register: claude_skill_source_directories
  when:
    - claude_skills_source_directory.stat.exists | default(false)
    - claude_skills_source_directory.stat.isdir | default(false)

- name: "{{ role_name }} | Skills | Check repo-managed Claude skill destinations"
  ansible.builtin.stat:
    path: "{{ claude_skills_dest }}/{{ claude_skill_source_directory.path | basename }}"
    follow: false
  loop: "{{ claude_skill_source_directories.files | default([]) }}"
  loop_control:
    loop_var: claude_skill_source_directory
    label: "{{ claude_skill_source_directory.path | basename }}"
  register: claude_skill_destinations

- name: "{{ role_name }} | Skills | Remove leftover Claude skill destination symlinks"
  ansible.builtin.file:
    path: "{{ claude_skills_dest }}/{{ item.claude_skill_source_directory.path | basename }}"
    state: absent
  loop: "{{ claude_skill_destinations.results | default([]) }}"
  loop_control:
    label: "{{ item.claude_skill_source_directory.path | basename }}"
  when:
    - item.stat.exists | default(false)
    - item.stat.islnk | default(false)

- name: "{{ role_name }} | Skills | Copy repo-managed Claude skills"
  ansible.builtin.copy:
    src: "{{ item.claude_skill_source_directory.path }}/"
    dest: "{{ claude_skills_dest }}/{{ item.claude_skill_source_directory.path | basename }}/"
    mode: preserve
  loop: "{{ claude_skill_destinations.results | default([]) }}"
  loop_control:
    label: "{{ item.claude_skill_source_directory.path | basename }}"
  when: >-
    not (
      ansible_check_mode
      and (
        (claude_skills_dest_stat.stat.islnk | default(false))
        or (
          (item.stat.exists | default(false))
          and (item.stat.islnk | default(false))
        )
      )
    )

- name: "{{ role_name }} | Check if .lsp.json exists and is not a symlink"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/.lsp.json"
  register: lsp_config_file

- name: "{{ role_name }} | Remove existing .lsp.json if it's not a symlink"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/.lsp.json"
    state: absent
  when: lsp_config_file.stat.exists and not lsp_config_file.stat.islnk

- name: "{{ role_name }} | Create symlink to Claude LSP configuration"
  ansible.builtin.file:
    src: "{{ role_path }}/files/.lsp.json"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/.lsp.json"
    state: link
    force: true

# MCP Server Configuration
# Use `claude mcp add` to idempotently configure MCP servers
- name: "{{ role_name }} | Check if vibe-kanban MCP server is configured"
  ansible.builtin.command: claude mcp get vibe_kanban
  register: mcp_vibe_kanban
  changed_when: false
  failed_when: false

- name: "{{ role_name }} | Add vibe-kanban MCP server"
  ansible.builtin.command: >
    claude mcp add vibe_kanban
    --transport stdio
    -- bunx vibe-kanban@latest --mcp
  when: mcp_vibe_kanban.rc != 0
