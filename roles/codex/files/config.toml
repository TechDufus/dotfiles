# Codex CLI config (managed by dotfiles role)
# Reference: https://developers.openai.com/codex/config-reference

# High-quality primary model; faster models are used for subagents below.
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
service_tier = "default"
personality = "pragmatic"

# Keep execution autonomous while retaining automatic review for eligible
# approval requests. App-tool approvals are configured separately below.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "danger-full-access"
web_search = "live"

[features]
memories = true

[agents]
max_concurrent_threads_per_session = 12
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"

# Keep local session history so resume/fork workflows stay useful.
[history]
persistence = "save-all"

[tui]
notifications = true
show_tooltips = false
status_line = ["model-with-reasoning", "task-progress", "git-branch", "pull-request-number", "branch-changes", "context-remaining", "five-hour-limit", "weekly-limit", "fast-mode"]
terminal_title = ["spinner", "project", "git-branch", "task-progress"]
theme = "catppuccin-mocha"

[tui.keymap.editor]
insert_newline = "alt-enter"

[mcp_servers.playwright]
command = "bunx"
args = ["@playwright/mcp@latest"]

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."granola@openai-curated"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."cloudflare@openai-curated"]
enabled = true

[plugins."cloudflare@openai-curated".mcp_servers."cloudflare-api"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[apps._default]
default_tools_approval_mode = "approve"

[memories]
disable_on_external_context = true

[desktop]
followUpQueueMode = "queue"
dock-icon-preference = "app-default"
conversationDetailMode = "STEPS_PROSE"
