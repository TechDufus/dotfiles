---
- name: "Herdr | MacOSX | Ensure user-local binary directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: "Herdr | MacOSX | Determine release architecture"
  ansible.builtin.set_fact:
    herdr_macos_arch: "{{ ansible_facts['architecture'] | replace('arm64', 'aarch64') }}"
  when: not ansible_check_mode

- name: "Herdr | MacOSX | Fetch latest stable release manifest"
  ansible.builtin.uri:
    url: "https://herdr.dev/latest.json"
    return_content: true
    status_code: 200
  register: herdr_release
  when: not ansible_check_mode

- name: "Herdr | MacOSX | Validate macOS release asset and checksum"
  ansible.builtin.assert:
    that:
      - herdr_release.json is defined
      - herdr_release.json is mapping
      - herdr_release.json.assets is defined
      - herdr_release.json.assets is mapping
      - herdr_release.json.sha256 is defined
      - herdr_release.json.sha256 is mapping
      - herdr_release.json.assets['macos-' ~ herdr_macos_arch] is defined
      - herdr_release.json.assets['macos-' ~ herdr_macos_arch] is string
      - herdr_release.json.assets['macos-' ~ herdr_macos_arch] is match('^https://[^/]+/.+')
      - herdr_release.json.sha256['macos-' ~ herdr_macos_arch] is defined
      - herdr_release.json.sha256['macos-' ~ herdr_macos_arch] is string
      - herdr_release.json.sha256['macos-' ~ herdr_macos_arch] is match('^[0-9a-fA-F]{64}$')
    fail_msg: "No verified macOS Herdr release asset exists for architecture {{ herdr_macos_arch }}."
  when: not ansible_check_mode

- name: "Herdr | MacOSX | Download latest stable Herdr binary"
  ansible.builtin.get_url:
    url: "{{ herdr_release.json.assets['macos-' ~ herdr_macos_arch] }}"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/herdr"
    mode: "0755"
    checksum: "sha256:{{ herdr_release.json.sha256['macos-' ~ herdr_macos_arch] }}"
  when: not ansible_check_mode

- name: "Herdr | MacOSX | Verify user-local Herdr binary"
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['user_dir'] }}/.local/bin/herdr"
      - --version
  changed_when: false
  when: not ansible_check_mode
