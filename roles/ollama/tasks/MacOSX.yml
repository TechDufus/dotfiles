---
- name: "Ollama | MacOSX | Install formula"
  community.general.homebrew:
    name: "{{ ollama_formula }}"
    state: present

- name: "Ollama | MacOSX | Start user service"
  community.general.homebrew_services:
    name: "{{ ollama_service_name }}"
    state: "{{ ollama_service_state }}"
  when: ollama_manage_service

- name: "Ollama | MacOSX | Wait for local API"
  ansible.builtin.uri:
    url: "{{ ollama_api_url }}/api/tags"
    method: GET
    status_code: 200
    return_content: true
  register: ollama_tags_response
  changed_when: false
  retries: "{{ ollama_api_ready_retries }}"
  delay: "{{ ollama_api_ready_delay }}"
  until: ollama_tags_response.status == 200
  when: not ansible_check_mode

- name: "Ollama | MacOSX | Inspect retired OMP helper files"
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ ollama_retired_managed_files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: ollama_retired_managed_file_stats

- name: "Ollama | MacOSX | Remove unchanged retired OMP helper files"
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ ollama_retired_managed_file_stats.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  when:
    - item.stat.isreg | default(false)
    - item.stat.checksum | default('') == item.item.checksum
