modelRoles: 
  default: openai-codex/gpt-5.6-sol:xhigh
  smol: openai-codex/gpt-5.6-luna
  tiny: openai-codex/gpt-5.6-luna:low
  task: openai-codex/gpt-5.6-terra
  slow: openai-codex/gpt-5.6-terra:xhigh
  plan: openai-codex/gpt-5.6-sol:xhigh
  designer: openai-codex/gpt-5.6-terra:high
