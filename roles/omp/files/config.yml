modelRoles:
  default: openai-codex/gpt-5.6-sol:xhigh
  smol: openai-codex/gpt-5.6-luna
  tiny: openai-codex/gpt-5.6-luna:low
  task: openai-codex/gpt-5.6-terra
  slow: openai-codex/gpt-5.6-terra:xhigh
  plan: openai-codex/gpt-5.6-sol:xhigh
  designer: openai-codex/gpt-5.6-terra:high
  vision: openai-codex/gpt-5.6-terra:high
  commit: openai-codex/gpt-5.6-luna:medium
  advisor: cursor/cursor-grok-4.6-medium
cycleOrder:
  - smol
  - default
theme:
  dark: dark-catppuccin
symbolPreset: nerd
display:
  shimmer: kitt
defaultThinkingLevel: xhigh
advisor:
  enabled: true
  syncBacklog: "3"
  immuneTurns: 5
error:
  notify: "on"
compaction:
  thresholdPercent: 35
  asyncEnabled: true
hideThinkingBlock: true
disabledProviders:
  - claude
  - claude-plugins
  - codex
  - opencode
  - cline
  - gemini
  - windsurf
  - vscode
  - github
  - amazon-bedrock
marketplace:
  autoUpdate: auto
bashInterceptor:
  enabled: true
edit:
  streamingAbort: true
lsp:
  diagnosticsOnEdit: true
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  proactiveLinking: true
  enhancedRecall: true
github:
  enabled: true
security:
  enabled: true
task:
  eager: always
  showResolvedModelBadge: true
  enableLsp: true
  enableEffort: true
  maxEffort: xhigh
  isolation:
    mode: auto
    commits: ai
skills:
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
mcp:
  enableProjectConfig: false
setupVersion: 1
vault:
  enabled: true
dev:
  autoqaConsent: granted
tier:
  openai: default
  subagent: priority
  advisor: priority
statusLine:
  transparent: true
  compactThinkingLevel: true
  sessionAccent: true
  showHookStatus: true
startup:
  showSplash: true
  quiet: true
autolearn:
  enabled: true
  autoContinue: true
readLineNumbers: true
bash:
  autoBackground:
    enabled: true
eval:
  rb: true
  jl: true
  autoBackground:
    enabled: true
todo:
  eager: preferred
secrets:
  enabled: true
terminal:
  showProgress: true
tui:
  tight: true
  scrollbackRebuild: true
  textSizing: false
  codexResetFireworks: true
  titleState: true
  hyperlinks: auto
  imeSafeCursor: false
snapcompact:
  systemPrompt: all
  toolResults: true
features:
  unexpectedStopDetection: true
codexResets:
  autoRedeem: "yes"
colorBlindMode: false
