modelRoles:
  smol: openai-codex/gpt-6.1-sol:low
  tiny: openai-codex/gpt-6.1-sol:low
  task: openai-codex/gpt-6.1-sol:high
  slow: openai-codex/gpt-6-astra
  plan: openai-codex/gpt-6-astra
  designer: openai-codex/gpt-6-astra
  vision: openai-codex/gpt-6.1-sol:high
  commit: openai-codex/gpt-6.1-sol:low
  advisor: openai-codex/gpt-6.1-sol:medium
  reviewer: openai-codex/gpt-6.1-sol
  default: openai-codex/gpt-6-astra:xhigh
cycleOrder:
  - smol
  - default
theme:
  dark: dark-catppuccin
symbolPreset: nerd
display:
  shimmer: kitt
defaultThinkingLevel: xhigh
providers:
  autoThinkingMaxEffort: max
advisor:
  enabled: true
  syncBacklog: "3"
  immuneTurns: 5
error:
  notify: "on"
compaction:
  thresholdPercent: 85
  asyncEnabled: true
  methodOrder:
    - remote
    - handoff
    - shake
    - soft
hideThinkingBlock: true
disabledProviders:
  - claude
  - claude-plugins
  - codex
  - opencode
  - cline
  - gemini
  - windsurf
  - vscode
  - github
  - amazon-bedrock
  - ollama
marketplace:
  autoUpdate: auto
bashInterceptor:
  enabled: true
edit:
  streamingAbort: true
lsp:
  diagnosticsOnEdit: true
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  proactiveLinking: true
  enhancedRecall: true
github:
  enabled: true
security:
  enabled: true
task:
  eager: always
  showResolvedModelBadge: true
  enableLsp: true
  maxEffort: xhigh
  isolation:
    commits: ai
    enabled: true
skills:
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
mcp:
  enableProjectConfig: false
setupVersion: 2
vault:
  enabled: true
dev:
  autoqaConsent: granted
tier:
  openai: default
  advisor: inherit
statusLine:
  transparent: true
startup:
  showSplash: true
readLineNumbers: true
eval:
  autoBackground:
    enabled: true
computer:
  enabled: true
todo:
  eager: preferred
secrets:
  enabled: true
terminal:
  showProgress: true
tui:
  tight: true
  codexResetFireworks: true
snapcompact:
  systemPrompt: none
  toolResults: false
features:
  unexpectedStopDetection: smart
codexResets:
  autoRedeem: "yes"
composer:
  shape: box
  tokenRate: true
