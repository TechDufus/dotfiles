---
- name: "{{ role_name }} | Checking for Distribution Config: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: distribution_config

- name: "{{ role_name }} | Run Tasks: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: distribution_config.stat.exists

- name: "{{ role_name }} | Check OpenCode candidate binaries"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ opencode_bin_candidates | unique }}"
  register: opencode_bin_checks

- name: "{{ role_name }} | Select OpenCode binary"
  ansible.builtin.set_fact:
    opencode_effective_bin: >-
      {{
        (
          opencode_bin_checks.results
          | selectattr('stat.exists')
          | map(attribute='item')
          | first
        )
        | default('')
      }}

- name: "{{ role_name }} | Check bun candidate binaries"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ opencode_bun_bin_candidates | unique }}"
  register: opencode_bun_checks
  when: opencode_effective_bin | length == 0

- name: "{{ role_name }} | Select bun binary"
  ansible.builtin.set_fact:
    opencode_bun_bin: >-
      {{
        (
          (opencode_bun_checks.results | default([]))
          | selectattr('stat.exists')
          | map(attribute='item')
          | first
        )
        | default('')
      }}
  when: opencode_effective_bin | length == 0

- name: "{{ role_name }} | Install OpenCode via bun"
  ansible.builtin.command:
    argv:
      - "{{ opencode_bun_bin }}"
      - install
      - -g
      - opencode-ai
  when:
    - opencode_effective_bin | length == 0
    - (opencode_bun_bin | default('')) | length > 0
  register: opencode_bun_install
  changed_when: "'installed' in (opencode_bun_install.stdout | default(''))"

- name: "{{ role_name }} | Resolve OpenCode on PATH after install"
  ansible.builtin.command: which opencode
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.opencode/bin:{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['HOME'] }}/.bun/bin:/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: opencode_which
  changed_when: false
  failed_when: false
  when: opencode_effective_bin | length == 0

- name: "{{ role_name }} | Record OpenCode from PATH"
  ansible.builtin.set_fact:
    opencode_effective_bin: "{{ opencode_which.stdout }}"
  when:
    - opencode_effective_bin | length == 0
    - (opencode_which.rc | default(1)) == 0

- name: "{{ role_name }} | Warn if OpenCode is unavailable"
  ansible.builtin.debug:
    msg: >-
      WARNING: OpenCode is not installed. On macOS install via Homebrew tap sst/tap,
      on Ubuntu via npm, or install bun and rerun this role.
  when:
    - opencode_effective_bin | length == 0
    - (opencode_bun_bin | default('')) | length == 0

# Configure opencode
- name: "{{ role_name }} | Ensure ~/.config/opencode directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode"
    state: directory
    mode: '0755'

- name: "{{ role_name }} | Check if opencode.json already exists"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json"
  register: opencode_config_file

- name: "{{ role_name }} | Backup existing opencode.json if it exists and is not a symlink"
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json.backup"
    remote_src: true
    mode: '0644'
  when: opencode_config_file.stat.exists and not opencode_config_file.stat.islnk

- name: "{{ role_name }} | Remove existing opencode.json if it's not a symlink"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json"
    state: absent
  when: opencode_config_file.stat.exists and not opencode_config_file.stat.islnk

- name: "{{ role_name }} | Create symlink to opencode.json"
  ansible.builtin.file:
    src: "{{ role_path }}/files/opencode.json"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/opencode.json"
    state: link
    force: true

- name: "{{ role_name }} | Check if ~/.config/opencode/scripts exists and is not a symlink"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/scripts"
  register: scripts_dir

- name: "{{ role_name }} | Remove existing scripts directory if it's not a symlink"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/scripts"
    state: absent
  when: scripts_dir.stat.exists and not scripts_dir.stat.islnk

- name: "{{ role_name }} | Create symlink to opencode scripts"
  ansible.builtin.file:
    src: "{{ role_path }}/files/scripts"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/scripts"
    state: link
    force: true

- name: "{{ role_name }} | Check if ~/.config/opencode/command exists and is not a symlink"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/command"
  register: command_dir

- name: "{{ role_name }} | Remove existing command directory if it's not a symlink"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/command"
    state: absent
  when: command_dir.stat.exists and not command_dir.stat.islnk

- name: "{{ role_name }} | Create symlink to opencode commands"
  ansible.builtin.file:
    src: "{{ role_path }}/files/command"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/command"
    state: link
    force: true

- name: "{{ role_name }} | Check if AGENTS.md already exists"
  ansible.builtin.stat:
