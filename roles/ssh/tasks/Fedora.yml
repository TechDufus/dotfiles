---
- name: "SSH | Fedora | Install openssh-clients"
  ansible.builtin.dnf:
    name: openssh-clients
    state: present
  become: true
  when: can_install_packages | default(false)

- name: "SSH | Fedora | openssh-clients skipped (no sudo)"
  ansible.builtin.debug:
    msg: "⚠️  Skipping openssh-clients install - sudo is not available for package installation."
  when: not (can_install_packages | default(false))
