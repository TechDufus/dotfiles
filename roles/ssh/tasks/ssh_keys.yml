- name: "SSH | Get [{{ item.name }}] key from Vault"
  ansible.builtin.command: "op read --account {{ op_account | default('my.1password.com') }} '{{ item.vault_path }}/private_key?ssh-format=openssh'"
  register: op_private_key
  changed_when: false
  failed_when: false
  no_log: true

- name: "SSH | Get [{{ item.name }}] public key from Vault"
  ansible.builtin.command: "op read --account {{ op_account | default('my.1password.com') }} '{{ item.vault_path }}/public_key'"
  register: op_public_key
  changed_when: false
  failed_when: false
  no_log: true

- name: "SSH | Warn when [{{ item.name }}] key read failed"
  ansible.builtin.debug:
    msg: >-
      SSH key '{{ item.name }}' was not deployed because 1Password read failed.
      Unlock 1Password and confirm {{ item.vault_path }} exposes private_key and public_key.
  when: (op_private_key.rc | default(1) != 0) or (op_public_key.rc | default(1) != 0)

- name: "SSH | Copy SSH keys"
  when:
    - op_private_key.rc | default(1) == 0
    - op_public_key.rc | default(1) == 0
  block:
    - name: "SSH | Deploy [{{ item.name }}] private key"
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ item.name }}"
        content: "{{ op_private_key.stdout }}\n"
        mode: "0600"
      no_log: true

    - name: "SSH | Deploy [{{ item.name }}] public key"
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ item.name }}.pub"
        content: "{{ op_public_key.stdout }}"
        mode: "0644"
      no_log: true
