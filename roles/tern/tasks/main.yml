---
- name: "{{ role_name }} | Check Tern settings"
  ansible.builtin.stat:
    path: "{{ tern_settings_path }}"
    follow: true
  register: tern_settings_stat
  failed_when: >-
    tern_settings_stat.stat.exists and not tern_settings_stat.stat.isreg

- name: "{{ role_name }} | Read Tern settings"
  ansible.builtin.slurp:
    src: "{{ tern_settings_path }}"
  register: tern_settings_raw
  when: tern_settings_stat.stat.exists

- name: "{{ role_name }} | Parse Tern settings"
  ansible.builtin.set_fact:
    tern_current_settings: >-
      {{ (tern_settings_raw.content | b64decode | trim | default('{}', true))
         | from_json if tern_settings_raw.content is defined else {} }}

# Shared values win; nested objects merge key by key; keys the shared file doesn't name stay as they are.
- name: "{{ role_name }} | Merge shared settings"
  ansible.builtin.set_fact:
    tern_merged_settings: >-
      {{ tern_current_settings | combine(tern_shared_settings, recursive=true) }}
  vars:
    tern_shared_settings: >-
      {{ lookup('ansible.builtin.file', 'settings.json') | from_json }}

- name: "{{ role_name }} | Ensure config directory"
  ansible.builtin.file:
    path: "{{ tern_config_dir }}"
    state: directory
    mode: "0755"

- name: "{{ role_name }} | Write shared settings to Tern"
  ansible.builtin.copy:
    content: >-
      {{ tern_merged_settings | to_nice_json(indent=2, sort_keys=False) }}
    dest: "{{ tern_settings_path }}"
    mode: "0644"
  when: tern_merged_settings != tern_current_settings

- name: "{{ role_name }} | Report"
  ansible.builtin.debug:
    msg: >-
      Set {{ tern_changed_keys | join(', ') }} in {{ tern_settings_path }}.
      Run "Reload settings" in Tern (or restart it) before changing anything there:
      a running Tern writes its old settings back on its next change.
  vars:
    tern_changed_keys: >-
      {{ tern_merged_settings | dict2items
         | reject('in', tern_current_settings | dict2items)
         | map(attribute='key') | list }}
  when: tern_merged_settings != tern_current_settings
