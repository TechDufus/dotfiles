---
- name: "{{ role_name }} | Read repo settings"
  ansible.builtin.slurp:
    src: "{{ tern_settings_source }}"
  register: tern_repo_raw

- name: "{{ role_name }} | Check live settings"
  ansible.builtin.stat:
    path: "{{ tern_settings_path }}"
    follow: true
  register: tern_live_stat
  failed_when: tern_live_stat.stat.exists and not tern_live_stat.stat.isreg

- name: "{{ role_name }} | Read live settings"
  ansible.builtin.slurp:
    src: "{{ tern_settings_path }}"
  register: tern_live_raw
  when: tern_live_stat.stat.exists

- name: "{{ role_name }} | Read last synced settings"
  ansible.builtin.slurp:
    src: "{{ tern_settings_base_path }}"
  register: tern_base_raw
  failed_when: false

# Per key: whichever side changed since the last sync wins (removals included); when both
# changed the same key, the repo wins and the app's value is reported and backed up.
- name: "{{ role_name }} | Merge repo and app changes"
  ansible.builtin.set_fact:
    tern_repo_settings: "{{ tern_repo_doc }}"
    tern_live_settings: "{{ tern_live_doc }}"
    tern_merge: "{{ tern_repo_doc | tern_three_way_merge(tern_live_doc, tern_base_doc) }}"
  vars:
    tern_repo_doc: "{{ tern_repo_raw.content | b64decode | from_json }}"
    tern_live_doc: "{{ (tern_live_raw.content | b64decode | from_json) if tern_live_raw.content is defined else {} }}"
    tern_base_doc: "{{ (tern_base_raw.content | b64decode | from_json) if tern_base_raw.content is defined else {} }}"

- name: "{{ role_name }} | Ensure config directory"
  ansible.builtin.file:
    path: "{{ tern_config_dir }}"
    state: directory
    mode: "0755"

- name: "{{ role_name }} | Write merged settings to Tern"
  ansible.builtin.copy:
    content: "{{ tern_merge.merged | to_nice_json(indent=2, sort_keys=False) }}"
    dest: "{{ tern_settings_path }}"
    mode: "0644"
    backup: "{{ tern_merge.conflicts | length > 0 }}"
  when: not tern_live_stat.stat.exists or tern_live_settings != tern_merge.merged
  register: tern_live_written

- name: "{{ role_name }} | Write merged settings to the repo"
  ansible.builtin.copy:
    content: "{{ tern_merge.merged | to_nice_json(indent=2, sort_keys=False) }}"
    dest: "{{ tern_settings_source }}"
    mode: "0644"
  when: tern_repo_settings != tern_merge.merged
  register: tern_repo_written

- name: "{{ role_name }} | Ensure state directory"
  ansible.builtin.file:
    path: "{{ tern_settings_base_path | dirname }}"
    state: directory
    mode: "0755"

- name: "{{ role_name }} | Record merged settings as the last sync"
  ansible.builtin.copy:
    content: "{{ tern_merge.merged | to_nice_json(indent=2, sort_keys=False) }}"
    dest: "{{ tern_settings_base_path }}"
    mode: "0644"

- name: "{{ role_name }} | Report"
  ansible.builtin.debug:
    msg: "{{ tern_report | select | list or ['Tern settings are in sync.'] }}"
  vars:
    tern_report:
      - >-
        {{ 'Copied changes made in Tern into ' ~ tern_settings_source ~ '; review with git diff and commit,'
           ~ ' or git restore it and rerun to drop them.' if tern_repo_written is changed else '' }}
      - >-
        {{ 'Updated ' ~ tern_settings_path ~ '. Run "Reload settings" in Tern (or restart it) before changing'
           ~ ' anything there: a running Tern writes its old settings back on its next change.'
           if tern_live_written is changed else '' }}
      - >-
        {{ ('Changed on both sides, kept the repo value (previous Tern file backed up beside it): '
           ~ (tern_merge.conflicts | map('to_json') | join(', '))) if tern_merge.conflicts else '' }}
